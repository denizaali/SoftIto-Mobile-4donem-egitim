<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{box-sizing: border-box; margin: 0; padding: 0;}

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: black;
            color: black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container{
            position: relative;
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            overflow: hidden;
            background: black;
            box-shadow: 0 10 25 rgba(0, 0, 0, 5);

        }
        video{
            width: 100%;
            display: block;
        }

        .custom-controls{
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparentirg,rgba(0,0,0,0.85));
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition:opacity 0.3s ease;
        }
        .timeline-container{
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-variant-numeric:tabular-nums;
        }
       .progress-bar {
   
    flex: 1;

    -webkit-appearance: none;

    height: 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.3);
    outline: none;
    cursor: pointer;
}


.progress-bar::-webkit-slider-thumb {
    
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px; 
    border-radius: 50%;
    background: #38bdf8;
    cursor: pointer;
}
.button-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.left-controls, .right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

button {
    background: none;
    border: none;
    color: white;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.1);
}
button:hover{
    background: rgba(255, 255, 255, 0.25);
}
.speed-badge{
    background:#0284c7 ;
    color: white;
}
    </style>




</head>
<h2 style="margin-bottom: 16px;">Html5 Video Player</h2>

<div class="player-container" id="videoBox">
    <!-- playsinline : İosta tam ekran patlamasını engeller-->
    <!-- controlsList: Üç nokta menüsünden indirme özelliğ-->
    <video id="myVideo" playsinline webkit-playsinline
    preload="metadata">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
        Tarayıcınız HTML5 video etiketini desteklemiyor
    </video>

    <div class="custom-controls">
    <!--ilerleme çubuğu ve süre-->
    <div class="timeline-container">
        <span id="currentTime">00:00</span>
        <input type="range" id="progressBar"
        class="progress-bar" min="0" max="100" value="0">
        <span id="durationTime">00:00</span>
    </div>

    <div class="button-group">
        <div class="left-controls">
            <button id="btnPlay">Play</button>
            <button id="btnMute">Mute</button>
           
        </div>
        <div class="right-controls">
             <button id="speedBtn" class="speed-badge">0x</button>
             <button id="btnPip">Pip</button>
             <button id="btnFull">Tam Ekran</button>
        </div>
    </div>    






</div>


<script>

const video = document.getElementById('myVideo');

const btnPlay = document.getElementById('btnPlay');

const btnMute = document.getElementById('btnMute');

const btnSpeed = document.getElementById('speedBtn');

const btnBip = document.getElementById('btnPip');

const btnFull = document.getElementById('btnFull');

const progressBar = document.getElementById('progressBar');

const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');


// 1. Play / Pause Yonetimi

btnPlay.addEventListener('click', () => {
    if(video.paused){
        video.play();
        btnPlay.innerText = 'Duraklat';
    }else{
        video.pause();
        btnPlay.innerText = 'Oynat';
    }
});
//2- Zaman formatlama

function formatTime(seconds){
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
}
//3-Metadata Yükleme ve Süre Bilgisi
video.addEventListener('loadedmetadata', () => {
    durationTimeEl.innerText = formatTime(video.duration);
    
});

//4- Zaman Güncelleme ve İlerleme Çubuğu
video.addEventListener('timeupdate', () => {
    currentTimeEl.innerText = formatTime(video.currentTime);
    const progressPercent = (video.currentTime / video.duration) * 100;
    progressBar.value = isNaN(progressPercent) ? 0 : progressPercent;
});
//5- Kullanıcı İlerleme Çubuğu ile Zamanı Değiştirme

progressBar.addEventListener('input', (e) => {
    const seekTime = (progressBar.value / 100) * video.duration;
    video.currentTime = seekTime;
});

//6- Ses Açma / Kapatma
btnMute.addEventListener('click', () => {
    video.muted = !video.muted;   
    btnMute.innerText = video.muted ? 'Ses Aç' : 'Ses Kapat';
});

//7- Oynatma Hızı Değiştirme
const speeds = [0.5, 1, 1.5, 2];
let speedIndex = 0; // Başlangıçta normal hız
btnSpeed.addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    video.playbackRate = speeds[speedIndex];
    btnSpeed.innerText = `${speeds[speedIndex]}x`;
});

//8- Picture-in-Picture (PIP) Modu
btnBip.addEventListener('click', async () => {
    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else {
            await video.requestPictureInPicture();
        }
    } catch (err) {
        console.error('PIP moduna geçişte hata oluştu:', err);
    }
});
//9- Tam Ekran Modu
btnFull.addEventListener('click', () => {
    const playerContainer = document.getElementById('videoBox');
    if (!document.fullscreenElement) {
        playerContainer.requestFullscreen().catch(err => {
            console.error(`Tam ekran moduna geçişte hata oluştu: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
});


</script>


























    
</body>
</html>
