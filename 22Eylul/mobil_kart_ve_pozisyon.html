<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        background: #0f172a;
        color: white;
        padding-bottom: 80px;
      }
      
      .mobile-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        padding: 16px 20px;
        border-bottom: 1px solid #334155;
        font-weight: 700;
      }
      .feed{
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .product-card{
        background: #1e293b;
        padding: 20px;
        border-radius: 16px;
        position: relative;
        border:1px solid #334155;
        overflow: hidden;
      }
      .badge-discount{
        position: absolute;
        top: 14px;
        right: 14px;
        background: #ef4444;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        color: white;
        box-shadow: 0 2px 8px rgba(239,68,68, 0.5);
      }
      .bottom-nav{
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
        border-top: 1px solid #334155;
        z-index: 100;
    
      }
      .fab-btn{
        position: fixed;
        bottom: 60px;
        right: 20px;
        width: 56px;
        height: 56px;
        background: #38bdf8;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(56,189,248,0.5);
      }
      
    </style>
  </head>
  <body>
  <header class="mobile-header">Keşfet & Alışveriş Yap</header>

  <main class="feed">
    <div class="product-card">
      <span class="badge-discount">%40 İNDİRİM</span>
      <h3>Kablosuz Kulaklık</h3>
      <p style="color: #94a3b8;margin: 8px 0 16px;">Aktif gürültü engelleme & 100 Saat pil ömrü</p>
      <strong style="color: #38bdf8; font-size: 20px;">1.500 ₺</strong>
    </div>

    <div class="product-card">
      <span class="badge-discount" style="background: #10b981;">Yeni</span>
      <h3>Akıllı Saat</h3>
      <p style="color: #94a3b8;margin: 8px 0 16px;">Nabız ölçümü & tansiyon ölçümü</p>
      <strong style="color: #38bdf8; font-size: 20px;">1.799 ₺</strong>
    </div>
    <button class="fab-btn">
        +
    </button>
    <nav  class="bottom-nav" >
        <span>Anasayfa</span>
        <span>Arama</span>
        <span>Sepetim</span>
        <span>Profil</span>
    </nav>
  </main>
</body>
</html>
