<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --primary: #4338ca;
        --primary-dark: #312e81;
        --accent: #10b981;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-light: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
    }

    body{
        font-family:Verdana, Geneva, Tahoma, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
    }

    .phone-container{
        width: 100%;
        max-width: 420px;
        background-color: var(--surface);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);

    }

    .top-bar{
        position: sticky;
        top: 0;
        z-index: 50;
        background : rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid var(--surface-light);

    }
    .user-profile{
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .avartar{
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
    }
    .balance-card{
        margin: 20px;
        background:linear-gradient(135deg,var(--primary),var(--primary-dark));
        padding: 20px;
        background-color: var(--primary-dark);
        color: white;
        text-align: center;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 10px 20px rgba(68, 67, 202, 0.3);
        border-radius: 16px;
    
    }
    .card-chip-badge{
        position: absolute;
        top: 20px;
        right: 20px;
        background:rgba(255, 255, 255, 0.15);
        background-color: var(--accent);
        color: white;
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
    }
    .balance-num{
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    .quick-actions{
        display: flex;
        justify-content: space-around;
        margin: 20px;
        padding: 0px 20px 20px;
        gap: 8px;

    }
    .action-btn{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        
    }
    .icon-circle {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--surface-light);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20;
    transition: all 0.2 ease;
}
.action-btn:hover .icon-circle{
    background: var(--primary);
    transform: translateY(-3px);

}
.tx-section{
    padding: 0 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;

}   
section-title{
    font-size: 16px;
    font-weight: 700;
    color: var(--text-muted);

}
.tx-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 14px;
}
.tx-left{
    display: flex;
    align-items: center;
    gap: 12;
}
.tx-icon{
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: rgba(16, 185,129 , 0.15);
  color: var(--accent);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
}
.tx-title{
    font-weight: 600;
    font-size: 14px;
}
.txt-date{
    font-size: 12px;
    color: var(--text-muted);
}
.txt-amount{
    font-weight: 700;
    font-size:15px;
    color: var(--accent);
}
.txt-amount.negative{
    color: red;
}




    </style>

     
</head>
<body>

    <div class="phone-container">

        <!-- sticky üst bas Header -->

        <header class="top-bar">
            <div class="user-profile">
                <div class="avatar">SÇ</div>
            </div>
            <div>
                <p style="font-size: 11px; color:var(--text-muted)"; >Hoş geldim</p>
                <strong>Akif YILDIZ</strong>
            </div>
            <button  style="background: none; border: none; cursor: pointer; font-size: 20px;">&#128276;</button>
        
        </header>


        <section class="balance-card">
            <span class="card-chip-badge" >Platinum</span>
            <p style="font-size: 13px; opacity: 0.85" >Toplam Bakiye</p>
            <div class="balance-num">1.234,56 ₺</div>
            <p style="font-size: 13px; opacity: 0.7" >IBAN: TR12 3456 7890 1234 5678 9012 34</p>
        </section>

        <section class="quick-actions">
            <button class="action-btn" >
                <div class="icon-circle">↗️</div>
                <span class="action-label">Para Gönder</span>
            </button>
            <button class="action-btn">
                
               <div class="icon-circle">💰</div>
                <span class="action-label">Para Yatır</span> 
                
            </button>
            <button class="action-btn">
                <div class="icon-circle">📈</div>
                <span class="action-label">Fatura Öde</span>
            </button>
            <button class="action-btn">
                <div class="icon-circle">QR</div>
                <span >Karekod</span>
            </button>

              </section>

              <!--Son Hareketler-->
            <section class="tx-section">
                <h4 class="section-title">Son Hesap Hareketleri</h4>

            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon">💼</div>
                    <div>
                        <div class="tx-title">Eğitim Hakedişi</div>
                        <div class="tx-date">Bugün, 14:30 - Havale</div>
                    </div>
                </div>
                <div class="tx-amount">+130.000 ₺</div>
            </div>
            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon">💼</div>
                    <div>
                        <div class="tx-title">Kahve Alındı</div>
                        <div class="tx-date">Bugün, 19:30 - Havale</div>
                    </div>
                </div>
                <div class="tx-amount">+60.000 ₺</div>
            </div>

            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon">💼</div>
                    <div>
                        <div class="tx-title">Kahve Alındı</div>
                        <div class="tx-date">Bugün, 19:30 - Havale</div>
                    </div>
                </div>
                <div class="tx-amount negative">-60.000 ₺</div>
            </div>

              



      

    </div>






    
</body>
</html>
